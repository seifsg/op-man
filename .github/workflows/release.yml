name: Release

# Pushing a version tag (v1.2.3) builds the APK, signs it with the owner's release key and attaches it as
# op-man.apk to that tag's GitHub Release, where the landing page's button (releases/latest/download/op-man.apk)
# downloads it from. Only plain vX.Y.Z tags release; other tags never replace the public download.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  android:
    uses: ./.github/workflows/android-apk.yml
    with:
      version: ${{ github.ref_name }}
      signed: true
    secrets: inherit

  publish:
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: op-man-apk
      - name: Publish the release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" op-man.apk --repo "$GITHUB_REPOSITORY" --title "OP Man $GITHUB_REF_NAME" --generate-notes
