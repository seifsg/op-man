name: Release

# Pushing a version tag (v1.2.3) builds the APK and attaches it as op-man.apk to that tag's GitHub Release,
# which is where the landing page's button (releases/latest/download/op-man.apk) downloads it from.
on:
  push:
    tags: ['v*']

jobs:
  android:
    uses: ./.github/workflows/android-apk.yml
    with:
      version: ${{ github.ref_name }}

  publish:
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: op-man-apk
      - name: Publish the release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" op-man.apk --repo "$GITHUB_REPOSITORY" --title "OP Man $GITHUB_REF_NAME" --generate-notes
